<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GUDLFT login portal to manage club bookings and points.">
    <title>GUDLFT Registration</title>
</head>
<body>
    <main>
        <h1>Welcome to the GUDLFT Registration Portal!</h1>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
        {% endwith %}
        <p>Please enter your secretary email to continue:</p>
        <form action="showSummary" method="post">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"/>
            <button type="submit">Enter</button>
        </form>
        <br>
        <a href="{{ url_for('pointsBoard') }}">View Club Points Board</a>
    </main>
</body>
</html>
