<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Public GUDLFT points board listing remaining booking points for every club.">
    <title>Club Points Board | GUDLFT</title>
</head>
<body>
    <main>
        <h1>Club Points Board</h1>
        <table border="2">
            <thead>
                <tr>
                    <th>Club</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
                {% for club in clubs %}
                <tr>
                    <td>{{ club['name'] }}</td>
                    <td style="text-align: center;">{{ club['points'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        {% if connected_club %}
        <a href="{{ url_for('showSummary', email=connected_club['email']) }}">Back to Home</a>
        {% else %}
        <a href="{{ url_for('index') }}">Back to Home</a>
        {% endif %}
    </main>
</body>
</html>
